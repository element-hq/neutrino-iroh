[workspace]
members = [
    "./neutrino-ffi-ble",
    "./uniffi-bindgen",
    "./vendor/iroh-ble-transport",
    "./vendor/blew",
]
# `vendor/iroh-ble-transport` and `vendor/blew` are members (shared lockfile,
# reachable via `-p`) but are deliberately excluded from the default set: bare
# `cargo check`/`cargo test` skip them, so they don't pull `blew` → `bluer` →
# `libdbus-sys` (needs system D-Bus). The .aar build enables
# `neutrino-ffi-ble --features ble` (which needs libdbus on Linux hosts).
default-members = ["./neutrino-ffi-ble", "./uniffi-bindgen"]
resolver = "3"

[workspace.package]
# Both vendored crates are AGPL-3.0-or-later, so this workspace (unlike the
# main neutrino one) cannot be offered under the commercial licence.
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
uniffi = { version = "0.31.1" }

[patch.crates-io]
# Local fork of `blew` (vendored at `vendor/blew`): adds extended-advertising +
# manufacturer-data (advertise + surface-on-scan) so BLE peer discovery can carry
# a full 32-byte node id plus a display name in one extended advertisement — the
# stock 0.2.3 only exposes `local_name` + `service_uuids` over legacy adverts.
blew = { path = "./vendor/blew" }
