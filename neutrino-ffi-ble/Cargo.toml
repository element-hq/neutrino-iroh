[package]
name = "neutrino-ffi-ble"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
# One cdylib carries BOTH this crate's uniffi scaffolding (`start_ble`) and
# neutrino-ffi's (the whole embedded API): uniffi-bindgen runs in library mode
# over `libneutrino_ble.so` and emits Kotlin for both namespaces, with the load
# name taken from this library file. The name must differ from neutrino-ffi's
# lib target ("neutrino") — duplicate lib names in one dependency graph
# collide. neutrino-ffi's own cdylib is not built here (cargo builds only the
# rlib of a path dependency), so the .so in this workspace is only ever ours.
crate-type = ["cdylib", "rlib"]
name = "neutrino_ble"

[dependencies]
# The composition targets: the FFI surface this crate re-exports an entrypoint
# for, and the seam types (`FederationLinkFactory`, `LinkContext`,
# `DatagramLink`).
neutrino-ffi = { git = "https://github.com/element-hq/neutrino", rev = "057373b058b7381b60c43e58dbf07b81c9e6a080" } 
neutrino-main = { git = "https://github.com/element-hq/neutrino", rev = "057373b058b7381b60c43e58dbf07b81c9e6a080" }

# `neutrino_main::DatagramLink` is an `#[async_trait]` trait we implement over iroh.
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
uniffi.workspace = true

iroh = { version = "0.98.2", features = ["unstable-custom-transports"] }
# BLE is the Android medium (`blew` over JNI); on Linux the transport's backend
# is `bluer`, which needs system D-Bus/BlueZ. Gate it behind `ble` so the
# default build (loopback tests, CI check) is iroh-only and needs no system
# Bluetooth stack. The Android .aar build enables `ble`.
iroh-ble-transport = { path = "../vendor/iroh-ble-transport", optional = true }
# `iroh::Connection::send_datagram` takes `bytes::Bytes`. Already in the tree
# transitively via iroh, so no new compile cost.
bytes = "1"
# iroh unifies reqwest's TLS backend onto rustls with no default crypto
# provider; `start_ble` installs the `ring` provider before the server builds
# its federation client (which would otherwise panic). rustls + ring are
# already transitive deps of iroh, so this only exposes them.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Android-only JNI bootstrap for blew (see src/ble_android.rs). `blew` is pulled
# in directly so we can call its `init_jvm`; cargo unifies it with the copy
# iroh-ble-transport already depends on. `jni`/`ndk-context` versions match what
# `blew` uses so the `JavaVM` type is identical. None of these compile for non-
# Android targets, so the host binding-gen build doesn't pull them.
[target.'cfg(target_os = "android")'.dependencies]
blew = { version = "0.2", optional = true }
jni = { version = "0.22", optional = true }
ndk-context = { version = "0.1", optional = true }

[features]
ble = ["dep:iroh-ble-transport", "dep:blew", "dep:jni", "dep:ndk-context"]

[dev-dependencies]
# The datagram-link test derives the expected node id from a secret to pin the
# iroh-id == ed25519-pubkey invariant `LinkContext` documents.
ed25519-dalek = "2.2.0"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
